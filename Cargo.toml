[package]
name = "niri-session-manager"
version = "0.4.1"
edition = "2021"

[dependencies]
tokio = { version = "1.41.1", features = ["full"] }
clap = { version = "4.5.21", features = ["derive"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
anyhow = "1.0.94"
niri-ipc = "25.5.1"
dirs = "5.0"
chrono = "0.4"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3"

[lints.clippy]
# Group denies (pedantic, nursery) are MSRV-stable; explicit lint names must exist on the project's MSRV (rust-version).
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
