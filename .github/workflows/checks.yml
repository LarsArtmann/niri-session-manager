name: Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Pipewire
        run: |
          sudo add-apt-repository ppa:pipewire-debian/pipewire-upstream
          sudo apt-get update
          sudo apt-get install pipewire pipewire-audio-client-libraries
      - name: Update to rust nightly
        run: rustup update nightly && rustup default nightly
      - name: Cache cargo builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Rustfmt
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check
      - name: Clippy
        run: |
          rustup component add clippy
          cargo clippy --all-features
      - name: Version smoke
        run: cargo run --quiet -- --version
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@491a84a640191f0cf972bc81af69b0f6c96ed392 # v4
        with:
          send-statistics: false
      - name: Install Lix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
        with:
          diagnostic-endpoint: ""
          source-url: https://install.lix.systems/lix/lix-installer-x86_64-linux
          logger: pretty
      - name: Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@2cdbb78a6eed25b3bc8b97f863549be5f6567e55 # main
        with:
          diagnostic-endpoint: ""
      - name: Enter devshell
        run: nix develop
      - name: Check nix formatting
        run: git ls-files '*.nix' | xargs nix run nixpkgs#nixfmt-rfc-style -- --check ./
      - name: Scan .nix files for dead code
        run: git ls-files '*.nix' | nix run nixpkgs#deadnix
      - name: Check for lints and suggestions
        run: nix run nixpkgs#statix -- check
      - name: Supply chain (cargo-deny)
        run: nix run nixpkgs#cargo-deny -- check advisories licenses bans sources
      - name: Living docs citations and links
        run: bash scripts/docs-citations.sh
